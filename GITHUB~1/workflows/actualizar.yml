name: Actualizar calendario economico

on:
  schedule:
    # Dia 1 de cada mes, 09:00 UTC (~06:00 hora Argentina/Uruguay)
    - cron: "0 9 1 * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestana Actions
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar los .ics (ventana movil de ~13 meses)
        run: |
          python generar_calendario.py
          OUTLOOK=1 python generar_calendario.py
          OUTLOOK=1 PAIS=AR python generar_calendario.py
          OUTLOOK=1 PAIS=UY python generar_calendario.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizacion automatica del calendario ($(date -u +%Y-%m-%d))"
            git push
          fi
